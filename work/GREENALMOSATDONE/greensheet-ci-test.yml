name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'app/package-lock.json'

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Run linter
        working-directory: app
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'app/package-lock.json'

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Run tests
        working-directory: app
        run: npm run test:run

  docker-build-test:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image (test)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: app/Dockerfile.app
          push: false
          target: prod
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-contexts: |
            localization=./localization/02-locale-files

      - name: Build backend image (test)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: app/Dockerfile.proxy
          push: false
          target: prod
          cache-from: type=gha
          cache-to: type=gha,mode=max
