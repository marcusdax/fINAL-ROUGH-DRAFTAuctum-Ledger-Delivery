# Production overlay: pin to pre-built GHCR images instead of local builds.
# Used with: docker compose -f app/docker-compose.yml -f docker-compose.prod.yml ...
# deploy.sh pulls the images first, so `up -d` starts them without rebuilding.
services:
  api:
    image: ghcr.io/marcusdax/auctum-ledger-proxy:latest
    pull_policy: always
    restart: always

  migrate:
    image: ghcr.io/marcusdax/auctum-ledger-proxy:latest
    pull_policy: always

  app:
    image: ghcr.io/marcusdax/auctum-ledger-app:latest
    pull_policy: always
    restart: always
